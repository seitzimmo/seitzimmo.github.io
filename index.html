<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Immobilienmanagement in Nürnberg, München und ganz Bayern: Verkauf und Vermarktung, Mietverwaltung, Bewertung, Mediation zwischen Mieter und Vermieter, Projektmanagement und Sanierung.">
<title>Seitz Immobilien</title>


<script>
  const DATEN = {
    bild: "images/image_1.jpeg"
  };
</script>

<style>
  :root {
    --weiss: #FFFFFF;
    --stein-hell: #F1ECE5;
    --stein: #E0D8CC;
    --text: #2A2723;
    --text-leise: #6A635A;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--weiss); color: var(--text);
    /* keine Schrift von fremden Servern: Avenir auf Apple-Geräten, sonst Systemschrift */
    font-family: "Avenir Next", "Avenir", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; line-height: 1.65;
    display: flex; flex-direction: column;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--weiss);
  }

  /* ===== Mitte ===== */
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 36px; padding: 48px 24px 72px; text-align: center; background: var(--stein-hell);
  }
  .rund {
    width: clamp(220px, 34vw, 340px); aspect-ratio: 1 / 1; border-radius: 50%;
    background: var(--stein) center / cover no-repeat;
    border: 8px solid var(--weiss); box-shadow: 0 18px 40px rgba(42, 39, 35, .18);
  }
  .text { max-width: 520px; }
  .text p { margin: 0; }
  .text .gross { font-size: clamp(1.3rem, 2.6vw, 1.7rem); font-weight: 500; line-height: 1.3; }
  .text .klein { margin-top: 10px; color: var(--text-leise); }
</style>
</head>
<body>

<main>
  <div class="rund" role="img" aria-label="Bild"></div>
  <div class="text">
    <p class="gross">Diese Webseite befindet sich im Aufbau.</p>
    <p class="klein">Bitte besuchen Sie uns später erneut.</p>
  </div>
</main>

<script>
  document.querySelector(".rund").style.backgroundImage = 'url("' + DATEN.bild + '")';
</script>
</body>
</html>
