<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Immobilienmanagement in Nürnberg, München und ganz Bayern. Diese Webseite befindet sich im Aufbau.">
<title>Immobilienmanagement in Nürnberg und München</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ===================== GLOBALE ANGABEN (hier anpassen) ===================== -->
<script>
  const DATEN = {
    firmenname: "Seitz Immobilien",
    bild:       "images/image_1.jpeg"   // das runde Bild in der Mitte (Datei im Ordner images/)
  };
</script>

<style>
  :root {
    --weiss: #FFFFFF;
    --stein-hell: #F1ECE5;
    --stein: #E0D8CC;
    --text: #2A2723;
    --text-leise: #6A635A;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--weiss); color: var(--text);
    font-family: "Avenir Next", "Avenir", "Nunito Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; line-height: 1.65;
    display: flex; flex-direction: column;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--weiss);
  }

  /* ===== Kopfzeile ===== */
  .kopf { background: var(--weiss); border-bottom: 1px solid var(--stein); }
  .kopf-innen { max-width: 1200px; height: 76px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; }
  .logo { display: flex; flex-direction: column; line-height: 1.15; color: var(--text); text-decoration: none; }
  .logo strong { font-size: 1.4rem; font-weight: 500; letter-spacing: .02em; }
  .logo span { font-size: .82rem; color: var(--text-leise); }

  /* ===== Mitte ===== */
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 36px; padding: 48px 24px 72px; text-align: center; background: var(--stein-hell);
  }
  .rund {
    width: clamp(220px, 34vw, 340px); aspect-ratio: 1 / 1; border-radius: 50%;
    background: var(--stein) center / cover no-repeat;
    border: 8px solid var(--weiss); box-shadow: 0 18px 40px rgba(42, 39, 35, .18);
  }
  .text { max-width: 520px; }
  .text p { margin: 0; }
  .text .gross { font-size: clamp(1.3rem, 2.6vw, 1.7rem); font-weight: 500; line-height: 1.3; }
  .text .klein { margin-top: 10px; color: var(--text-leise); }
</style>
</head>
<body>

<header class="kopf">
  <div class="kopf-innen">
    <a class="logo" href="#"><strong data-wert="firmenname"></strong><span>Immobilienmanagement in Bayern</span></a>
  </div>
</header>

<main>
  <div class="rund" role="img" aria-label="Bild"></div>
  <div class="text">
    <p class="gross">Diese Webseite befindet sich im Aufbau.</p>
    <p class="klein">Bitte besuchen Sie uns später erneut.</p>
  </div>
</main>

<script>
  document.querySelectorAll("[data-wert]").forEach(e => { e.textContent = DATEN[e.dataset.wert]; });
  document.querySelector(".rund").style.backgroundImage = 'url("' + DATEN.bild + '")';
  document.title = DATEN.firmenname + " – Immobilienmanagement";
</script>
</body>
</html>
